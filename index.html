<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>멘델리예프 다이스 - 화학 원소 주사위 시뮬레이터</title>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Orbitron:wght@400;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div id="background-animation"></div>
    
    <header class="header">
        <h1 class="title">
            <i class="fas fa-atom"></i>
            멘델리예프 다이스
        </h1>
        <p class="subtitle">화학 원소 주사위 시뮬레이터</p>
    </header>

    <main class="main-container">
        <!-- 주사위 선택 패널 -->
        <section class="dice-selection-panel">
            <h2 class="section-title">
                <i class="fas fa-dice"></i> 주사위 선택
            </h2>
            <div class="dice-grid">
                <div class="dice-option" data-dice="d4">
                    <input type="checkbox" id="d4" class="dice-checkbox">
                    <label for="d4" class="dice-label">
                        <div class="dice-icon d4-icon">
                            <i class="fas fa-dice-d4"></i>
                        </div>
                        <span class="dice-name">d4</span>
                        <span class="dice-desc">4면체</span>
                    </label>
                </div>
                
                <div class="dice-option" data-dice="d6">
                    <input type="checkbox" id="d6" class="dice-checkbox">
                    <label for="d6" class="dice-label">
                        <div class="dice-icon d6-icon">
                            <i class="fas fa-dice-six"></i>
                        </div>
                        <span class="dice-name">d6</span>
                        <span class="dice-desc">6면체</span>
                    </label>
                </div>
                
                <div class="dice-option" data-dice="d8">
                    <input type="checkbox" id="d8" class="dice-checkbox">
                    <label for="d8" class="dice-label">
                        <div class="dice-icon d8-icon">
                            <i class="fas fa-dice-d8"></i>
                        </div>
                        <span class="dice-name">d8</span>
                        <span class="dice-desc">8면체</span>
                    </label>
                </div>
                
                <div class="dice-option" data-dice="d10">
                    <input type="checkbox" id="d10" class="dice-checkbox">
                    <label for="d10" class="dice-label">
                        <div class="dice-icon d10-icon">
                            <i class="fas fa-dice-d10"></i>
                        </div>
                        <span class="dice-name">d10</span>
                        <span class="dice-desc">10면체</span>
                    </label>
                </div>
                
                <div class="dice-option" data-dice="d12">
                    <input type="checkbox" id="d12" class="dice-checkbox">
                    <label for="d12" class="dice-label">
                        <div class="dice-icon d12-icon">
                            <i class="fas fa-dice-d12"></i>
                        </div>
                        <span class="dice-name">d12</span>
                        <span class="dice-desc">12면체</span>
                    </label>
                </div>
                
                <div class="dice-option" data-dice="d20">
                    <input type="checkbox" id="d20" class="dice-checkbox">
                    <label for="d20" class="dice-label">
                        <div class="dice-icon d20-icon">
                            <i class="fas fa-dice-d20"></i>
                        </div>
                        <span class="dice-name">d20</span>
                        <span class="dice-desc">20면체</span>
                    </label>
                </div>
                
                <div class="dice-option" data-dice="d100">
                    <input type="checkbox" id="d100" class="dice-checkbox">
                    <label for="d100" class="dice-label">
                        <div class="dice-icon d100-icon">
                            <i class="fas fa-dice-d100"></i>
                        </div>
                        <span class="dice-name">d100</span>
                        <span class="dice-desc">100면체</span>
                    </label>
                </div>
            </div>
        </section>

        <!-- 연산 옵션 패널 -->
        <section class="operation-panel">
            <h2 class="section-title">
                <i class="fas fa-calculator"></i> 연산 설정
            </h2>
            <div class="operation-options">
                <div class="operation-toggle">
                    <input type="checkbox" id="multiplyDivide" class="operation-checkbox">
                    <label for="multiplyDivide" class="operation-label">
                        <i class="fas fa-times"></i>
                        <i class="fas fa-divide"></i>
                        곱셈/나눗셈 포함
                    </label>
                </div>
                <div class="operation-info">
                    <p>기본: 덧셈(+), 뺄셈(-)</p>
                    <p>추가: 곱셈(×), 나눗셈(÷)</p>
                </div>
            </div>
        </section>

        <!-- 주사위 굴리기 버튼 -->
        <section class="roll-section">
            <button id="rollDiceBtn" class="roll-button" disabled>
                <i class="fas fa-dice"></i>
                주사위 굴리기
            </button>
            <p class="roll-instruction">최소 1개 이상의 주사위를 선택하세요</p>
        </section>

        <!-- 주사위 결과 표시 -->
        <section class="dice-results" id="diceResults" style="display: none;">
            <h2 class="section-title">
                <i class="fas fa-chart-bar"></i> 주사위 결과
            </h2>
            <div id="diceResultsContainer" class="dice-results-container">
                <!-- 주사위 결과가 여기에 동적으로 표시됩니다 -->
            </div>
        </section>

        <!-- 계산 결과 표시 -->
        <section class="calculation-results" id="calculationResults" style="display: none;">
            <h2 class="section-title">
                <i class="fas fa-table"></i> 계산 결과 및 원소 정보
            </h2>
            <div class="results-filter">
                <input type="text" id="elementFilter" placeholder="원소 기호 또는 이름으로 검색...">
                <i class="fas fa-search"></i>
            </div>
            <div id="calculationResultsContainer" class="calculation-results-container">
                <!-- 계산 결과가 여기에 동적으로 표시됩니다 -->
            </div>
        </section>
    </main>

    <!-- 로딩 모달 -->
    <div id="loadingModal" class="modal" style="display: none;">
        <div class="modal-content loading-content">
            <div class="atom-loader">
                <div class="atom-nucleus"></div>
                <div class="atom-orbit orbit-1"></div>
                <div class="atom-orbit orbit-2"></div>
                <div class="atom-orbit orbit-3"></div>
                <div class="atom-electron electron-1"></div>
                <div class="atom-electron electron-2"></div>
                <div class="atom-electron electron-3"></div>
            </div>
            <p class="loading-text">주사위를 굴리는 중...</p>
        </div>
    </div>

    <!-- 원소 정보 모달 -->
    <div id="elementModal" class="modal" style="display: none;">
        <div class="modal-content element-modal-content">
            <button class="close-button" onclick="closeElementModal()">
                <i class="fas fa-times"></i>
            </button>
            <div id="elementDetails">
                <!-- 원소 상세 정보가 여기에 표시됩니다 -->
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
