<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mendeleev Dice Simulator - 멘델리예프 다이스 시뮬레이터</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;700&family=Noto+Sans+KR:wght@300;400;700&display=swap" rel="stylesheet">
</head>
<body>
    <div class="container">
        <header>
            <h1>Mendeleev Dice Simulator</h1>
            <p class="subtitle">멘델리예프 다이스 시뮬레이터</p>
        </header>

        <main>
            <!-- Dice Selection Section -->
            <section class="dice-selection">
                <h2>주사위 선택</h2>
                <div class="dice-grid">
                    <div class="dice-option" data-dice="d4">
                        <input type="checkbox" id="d4" name="dice" value="4">
                        <label for="d4">
                            <div class="dice-icon d4-icon">△</div>
                            <span>d4</span>
                        </label>
                    </div>
                    <div class="dice-option" data-dice="d6">
                        <input type="checkbox" id="d6" name="dice" value="6">
                        <label for="d6">
                            <div class="dice-icon d6-icon">⬡</div>
                            <span>d6</span>
                        </label>
                    </div>
                    <div class="dice-option" data-dice="d8">
                        <input type="checkbox" id="d8" name="dice" value="8">
                        <label for="d8">
                            <div class="dice-icon d8-icon">◆</div>
                            <span>d8</span>
                        </label>
                    </div>
                    <div class="dice-option" data-dice="d10">
                        <input type="checkbox" id="d10" name="dice" value="10">
                        <label for="d10">
                            <div class="dice-icon d10-icon">⬢</div>
                            <span>d10</span>
                        </label>
                    </div>
                    <div class="dice-option" data-dice="d12">
                        <input type="checkbox" id="d12" name="dice" value="12">
                        <label for="d12">
                            <div class="dice-icon d12-icon">⬟</div>
                            <span>d12</span>
                        </label>
                    </div>
                    <div class="dice-option" data-dice="d20">
                        <input type="checkbox" id="d20" name="dice" value="20">
                        <label for="d20">
                            <div class="dice-icon d20-icon">⬢</div>
                            <span>d20</span>
                        </label>
                    </div>
                    <div class="dice-option" data-dice="d100">
                        <input type="checkbox" id="d100" name="dice" value="100">
                        <label for="d100">
                            <div class="dice-icon d100-icon">%</div>
                            <span>d100</span>
                        </label>
                    </div>
                </div>
            </section>

            <!-- Operation Toggle -->
            <section class="operation-toggle">
                <h2>연산 옵션</h2>
                <div class="toggle-container">
                    <input type="checkbox" id="multiply-divide" name="operation">
                    <label for="multiply-divide">
                        <span class="toggle-text">곱셈(×) / 나눗셈(÷) 포함</span>
                    </label>
                </div>
            </section>

            <!-- Roll Button -->
            <section class="roll-section">
                <button id="roll-btn" class="roll-button">
                    <span class="roll-text">Roll Dice</span>
                    <span class="roll-icon">🎲</span>
                </button>
            </section>

            <!-- Results Section -->
            <section class="results-section" id="results" style="display: none;">
                <h2>주사위 결과</h2>
                <div class="dice-results" id="dice-results">
                    <!-- Dice results will be inserted here -->
                </div>
            </section>

            <!-- Calculations Section -->
            <section class="calculations-section" id="calculations" style="display: none;">
                <h2>계산 결과</h2>
                <div class="calculations-container">
                    <table class="calculations-table" id="calculations-table">
                        <thead>
                            <tr>
                                <th>계산식</th>
                                <th>결과값</th>
                                <th>원소기호</th>
                                <th>원소이름</th>
                            </tr>
                        </thead>
                        <tbody id="calculations-body">
                            <!-- Calculation results will be inserted here -->
                        </tbody>
                    </table>
                </div>
            </section>
        </main>

        <footer>
            <p>© 2024 Mendeleev Dice Simulator</p>
        </footer>
    </div>

    <script src="elements.js"></script>
    <script src="script.js"></script>
</body>
</html>
